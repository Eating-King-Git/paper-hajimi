name: Controller and resource checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test portable controller
        run: python3 tools/test_face_game.py
      - name: Validate paired resources
        run: python3 tools/validate_face_game.py
